# Render Blueprint for Secure Case API
# Deploy from Render Dashboard → New → Blueprint

services:
  - type: web
    name: secure-case-api
    runtime: node
    rootDir: Backend
    plan: free

    buildCommand: npm ci
    startCommand: npm start

    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production

      # Set this to your deployed frontend URL
      - key: FRONTEND_ORIGIN
        sync: false

      # MongoDB Atlas connection string
      - key: MONGO_URI
        sync: false

      # Render generates this automatically
      - key: JWT_SECRET
        generateValue: true

      # Authentication PIN hashes
      - key: IO_PIN_HASH
        sync: false

      - key: LO_PIN_HASH
        sync: false

      - key: ADMIN_PIN_HASH
        sync: false

      # Set to 1 so the three role quick-login buttons work on the demo frontend.
      # Clear this variable and redeploy after the demo to require PIN logins.
      - key: DEMO_LOGIN
        value: "1"

      # Google Gemini
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      # Ollama is intended for local development.
      - key: OLLAMA_URL
        value: http://localhost:11434