# Render Blueprint for Secure Case API
# Deploy from Render Dashboard → New → Blueprint

services:
  - type: web
    name: secure-case-api
    runtime: node
    rootDir: Backend
    plan: free

    buildCommand: npm ci
    startCommand: npm start

    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production

      # Set this to your deployed frontend URL
      - key: FRONTEND_ORIGIN
        sync: false

      # MongoDB Atlas connection string
      - key: MONGO_URI
        sync: false

      # Render generates this automatically
      - key: JWT_SECRET
        generateValue: true

      # Authentication PIN hashes
      - key: IO_PIN_HASH
        sync: false

      - key: LO_PIN_HASH
        sync: false

      - key: ADMIN_PIN_HASH
        sync: false

      # Set to 1 so the three role quick-login buttons work on the demo frontend.
      # Clear this variable and redeploy after the demo to require PIN logins.
      - key: DEMO_LOGIN
        value: "1"

      # Google Gemini (fast first-pass analysis)
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: AI_REQUEST_TIMEOUT_MS
        value: "15000"

      - key: AI_ANALYSIS_VERSION
        value: fast-v1

      # Ollama Cloud (Nemotron) fallback — API key stays server-side.
      - key: OLLAMA_API_KEY
        sync: false

      - key: OLLAMA_MODEL
        value: nemotron:cloud

      - key: OLLAMA_BASE_URL
        value: https://ollama.com

      - key: OLLAMA_TIMEOUT_MS
        value: "45000"

      # No Ollama daemon exists on Render: disable the localhost fallback.
      - key: OLLAMA_LOCAL
        value: "0"

      # Kept for local development only.
      - key: OLLAMA_URL
        value: http://localhost:11434